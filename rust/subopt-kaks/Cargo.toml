[package]
name = "subopt-kaks"
version = "0.1.0"
edition = "2021"
authors = ["Jason Stajich <jasonst@ucr.edu>"]
description = "Ka/Ks (dN/dS) estimation from coding-sequence alignments (Rust port of the subopt-kaks C tools)"
license = "MIT"

[[bin]]
name = "kaks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
