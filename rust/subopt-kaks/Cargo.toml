[package]
name = "subopt-kaks"
version = "0.2.0"
edition = "2021"
authors = ["Jason Stajich <jasonst@ucr.edu>"]
description = "Ka/Ks (dN/dS) estimation from coding-sequence alignments (Rust port of the subopt-kaks C tools, plus codeml-style pairwise ML)"
license = "MIT"

[lib]
name = "subopt_kaks"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kaks"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# command-line tool
cli = ["dep:clap"]
# browser build: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm
wasm = ["dep:wasm-bindgen"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
